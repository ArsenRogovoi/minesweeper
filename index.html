<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minesweeper</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="desktop desktop--solid">
    <div class="window">
      <div class="window__titlebar">
        <span class="window__icon" aria-hidden="true"></span>
        <h1 class="window__title">Minesweeper</h1>
        <span
          class="window__button window__button--minimize"
          aria-hidden="true"
        ></span>
        <span
          class="window__button window__button--maximize"
          aria-hidden="true"
        ></span>
        <span
          class="window__button window__button--close"
          aria-hidden="true"
        ></span>
      </div>
      <nav class="menubar"></nav>
      <main class="game">
        <div class="status">
          <div class="led led--mines">
            <span class="led__digit led__digit--0"></span
            ><span class="led__digit led__digit--1"></span
            ><span class="led__digit led__digit--0"></span>
          </div>
          <button
            class="smiley smiley--normal"
            type="button"
            aria-label="New game"
          ></button>
          <div class="led led--timer">
            <span class="led__digit led__digit--0"></span
            ><span class="led__digit led__digit--0"></span
            ><span class="led__digit led__digit--0"></span>
          </div>
        </div>
        <div class="field" tabindex="0"></div>
      </main>
    </div>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
